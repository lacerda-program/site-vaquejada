spring.application.name=api

# --- Banco de dados H2 (em memória) ---
spring.datasource.url=jdbc:h2:mem:sertaodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# O schema e recriado a cada boot e repovoado pelo DataSeeder.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Sem open-in-view: a sessao morre no fim do servico, entao o mapeamento para DTO
# acontece dentro da transacao. Evita consulta lazy disparada durante a serializacao.
spring.jpa.open-in-view=false
# Carrega as colecoes lazy em blocos, em vez de uma consulta por evento.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# --- Console do H2: http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:sertaodb) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- CORS: origens do front. Lista separada por virgula. ---
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# --- Credencial das rotas protegidas (/api/ingressos/**) ---
# Apenas para desenvolvimento. Sobrescreva por variavel de ambiente antes de publicar:
#   APP_SECURITY_ADMIN_SENHA=...
app.security.admin.usuario=admin
app.security.admin.senha=vaquejada

# --- Regras de compra ---
# Janela de pagamento do PIX; casa com o contador de 10 min do checkout.
app.pedido.minutos-para-pagar=10
# Teto por CPF em cada evento, igual ao seletor de quantidade da tela.
app.pedido.limite-ingressos-por-cpf=10
# Frequencia da varredura que devolve ao estoque os pedidos vencidos.
app.pedido.intervalo-expiracao-ms=60000
